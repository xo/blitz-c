[package]
name = "blitz-c"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "C ABI bindings for headless Blitz HTML rendering"
repository = "https://github.com/dioxuslabs/blitz"
publish = false

# The crate is named `blitz-c`, but the *library* is named `blitz`, and that is
# what determines the artifact name: libblitz.a / libblitz.so / blitz.lib.
[lib]
name = "blitz"
crate-type = ["staticlib", "cdylib", "rlib"]

# This crate is its own workspace root. Required, not cosmetic: cargo only
# honours [patch] in a workspace root manifest, and the patch below is load
# bearing (see the note above it).
[workspace]

[dependencies]
# Blitz, pinned. All five crates must share one git source + rev so they resolve
# to a single checkout — mixing revs gives you two incompatible copies of
# blitz-traits and a wall of trait-mismatch errors.
blitz-dom = { git = "https://github.com/dioxuslabs/blitz", rev = "c27b4ca14158dc457f35c78eb32b8c4fec906b7e" }
blitz-html = { git = "https://github.com/dioxuslabs/blitz", rev = "c27b4ca14158dc457f35c78eb32b8c4fec906b7e" }
# NOTE: blitz-net is deliberately NOT a dependency. It sets reqwest's
# `native-tls` feature on its dependency line, unconditionally rather than
# behind a cargo feature, so depending on it puts OpenSSL in the graph and
# `-lssl -lcrypto` on every downstream link — and because cargo unions
# features, nothing here can subtract it (`default-features = false` has no
# effect; there is no rustls feature to pick instead). src/net.rs implements
# blitz_traits::net::NetProvider against this crate's own reqwest instead.
# Re-check that crate's manifest when bumping the pin: if it ever gates TLS
# behind a feature, src/net.rs can go away.
blitz-paint = { git = "https://github.com/dioxuslabs/blitz", rev = "c27b4ca14158dc457f35c78eb32b8c4fec906b7e" }
blitz-traits = { git = "https://github.com/dioxuslabs/blitz", rev = "c27b4ca14158dc457f35c78eb32b8c4fec906b7e" }

# AnyRender is declared against the same git source that blitz-paint uses, which
# is the main branch. The source must be the same as blitz's. A different one,
# such as crates.io or a pinned rev, puts two distinct `anyrender` crates in the
# graph. `PaintScene` from one is not `PaintScene` from the other, and
# `paint_scene(scene, ...)` stops compiling. Cargo does not allow a patch that
# points at the same git source, so the commit is pinned in Cargo.lock, not here:
#   cargo update -p anyrender --precise <commit>
# Until blitz 0.3.0-beta.4 blitz used crates.io, and a [patch.crates-io] entry
# pinned the rev.
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello_cpu = { git = "https://github.com/DioxusLabs/anyrender", branch = "main", features = ["multithreading"] }

# Must match the peniko that AnyRender and Blitz resolve to, since `Fill`,
# `Rect` and `Color` cross the boundary between them.
peniko = "0.6.0"

png = "0.18"
url = "2.5"

# TLS has to be opted into explicitly, or every https:// fetch fails at runtime.
# The TLS backend itself is selected by the tls-* features below, not here.
#
# `webpki-roots` bundles Mozilla's root store into the binary, which is what you
# want for a static library — it works in a scratch container with no
# ca-certificates package installed. Swap it for `rustls-native-certs` if you
# need the host trust store instead, e.g. behind a corporate MITM proxy.
#
# NOTE: default-features = false here does NOT guarantee OpenSSL stays out of the
# build. Cargo unions features across the whole graph, so any other crate that
# enables reqwest's `default-tls` or `native-tls` brings OpenSSL back in and you
# get -lssl -lcrypto at link time, with no way to opt out from this manifest.
# That is why blitz-net is not a dependency (see the note above). Verify with
# `make check-tls`.
reqwest = { version = "0.13", default-features = false, features = [
    "webpki-roots",
    "charset",
    "http2",
] }

# Sub-resource fetching in src/net.rs: data: URLs.
data-url = "0.3"

# Only used by the tls-ring feature, to install the crypto provider.
#
# This version MUST match the rustls that reqwest resolves to, or the installed
# provider applies to a different rustls than the one actually doing the
# handshake, and connections fail at runtime with no crypto provider available.
# Check with: cargo tree -i rustls
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
# `sync` is for the per-origin request semaphore in src/net.rs.
tokio = { version = "1.42", features = ["rt-multi-thread", "time", "sync"] }

# Markdown -> HTML.
pulldown-cmark = "0.13"

tracing-subscriber = { version = "0.3", optional = true }

# fontique is already in the graph through blitz. It is named here only so that
# the `fontconfig-dlopen` feature below can switch on its feature of that name.
fontique = { version = "0.12", default-features = false, optional = true }

[features]
default = ["tls-aws-lc"]

# --- TLS backend (pick one) ---
#
# Both are pure-Rust stacks in the sense that matters here: neither links
# OpenSSL, and neither needs a system TLS library at runtime. They differ in
# what the *crypto* primitives are built from.
#
# tls-aws-lc: rustls with aws-lc-rs. The reqwest default. Fastest and FIPS-
#   capable, but aws-lc-rs compiles C and assembly, so building it needs cmake
#   and a C toolchain (plus NASM on Windows).
#
# tls-ring: rustls with ring, installed as the process default provider at
#   context creation. Drops the cmake/NASM build requirement. ring still carries
#   some assembly, but it vendors everything and adds no system dependency.
#
# Neither removes -lssl -lcrypto on its own if something else in the graph pulls
# native-tls. Run `make check-tls` to confirm.
tls-aws-lc = ["reqwest/rustls"]
tls-ring = ["reqwest/rustls-no-provider", "dep:rustls"]

# Route Blitz's `tracing` output to stderr. Off by default: a library linked
# into a host process should not install global subscribers uninvited.
tracing = ["dep:tracing-subscriber"]

# Load fontconfig with dlopen at run time instead of linking it. Off by default.
#
# Without it, building for Linux or BSD runs pkg-config for fontconfig, so the
# build needs fontconfig development files for the *target*. A target with no
# such sysroot, such as musl or FreeBSD built from a Linux host, cannot get
# them, and has to use this feature. The cost: the archive no longer links
# -lfontconfig, so a consumer that links fully statically gets no system fonts
# and renders blank text. Set the feature with --features, not with the
# RUST_FONTCONFIG_DLOPEN variable: the variable skips pkg-config but leaves
# fontique looking for symbols that only the feature provides.
fontconfig-dlopen = ["dep:fontique", "fontique/fontconfig-dlopen"]

[patch.crates-io]
# Blitz builds against a development branch of vello, because glifo 0.4.0 with
# the embolden change is not released yet (DioxusLabs/vello, branch
# devin/glifo-0.4.0-embolden-2049). These three crates must come from that one
# checkout. Blitz also patches vello_gpu, which this crate does not use. The rev is the one in the Cargo.lock of the pinned blitz, so this
# builds what upstream builds. Drop the three lines when glifo 0.4.0 or newer is
# on crates.io and blitz stops patching it.
glifo = { git = "https://github.com/dioxuslabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
vello_common = { git = "https://github.com/dioxuslabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
vello_cpu = { git = "https://github.com/dioxuslabs/vello", rev = "be500db2b3a9cb3613de0e2c43f9358635c1f309" }
# Uncomment as needed. Which of these appear depends on which blitz-paint
# features are enabled; cargo warns about patches it didn't use, so add them
# only when a duplicate actually shows up in `cargo tree`.
# anyrender_svg = { git = "https://github.com/dioxuslabs/anyrender", rev = "3e7fc16bc0223aaf0f053f1162b36146070e2f75" }
# anyrender_serialize = { git = "https://github.com/dioxuslabs/anyrender", rev = "3e7fc16bc0223aaf0f053f1162b36146070e2f75" }
# wgpu_context = { git = "https://github.com/dioxuslabs/anyrender", rev = "3e7fc16bc0223aaf0f053f1162b36146070e2f75" }

# --- Profiles -----------------------------------------------------------------
# Previously inherited from the blitz workspace; redefined here. Note that none
# of these set `panic = "abort"`. The FFI layer relies on `catch_unwind` to stop
# panics crossing into Go, and abort would turn a recoverable error into a dead
# process.

[profile.profile]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.p2]
inherits = "production"
opt-level = 2
